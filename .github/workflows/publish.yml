name: Publiceren op npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Controleer dat de tag bij de versie past
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${{ github.event.release.tag_name }}" || {
            echo "Tag ${{ github.event.release.tag_name }} past niet bij versie $version"
            exit 1
          }

      - name: Controleer dat VERSION in de code bij package.json past
        run: |
          package=$(node -p "require('./package.json').version")
          source=$(sed -n "s/^export const VERSION = '\(.*\)';/\1/p" src/client.ts)
          test "$package" = "$source" || { echo "package.json ($package) en src/client.ts ($source) verschillen"; exit 1; }

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:smoke
      - run: npm run check:package

      - name: Publiceren
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
